services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
      - daonroad-cache:/app/cache
    environment:
      - OSRM_BASE_URL=http://osrm:5000
      - DAONROAD_BIND_HOST=0.0.0.0
      - OSRM_TABLE_COORD_LIMIT=100
    depends_on:
      - osrm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  osrm:
    image: osrm/osrm-backend:latest
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./osrm-data:/data:ro
    command: osrm-routed --algorithm mld --max-table-size 100 /data/south-korea-latest.osrm
    restart: unless-stopped

volumes:
  daonroad-cache:
